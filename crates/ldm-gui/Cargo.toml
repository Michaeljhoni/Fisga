[package]
name = "ldm-gui"
description = "ldm-gui: GTK4 interface (download list and the \"Novo download\" window); a client of ldmd"
version.workspace = true
edition.workspace = true
rust-version = "1.83"

[[bin]]
name = "ldm-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
# Tray icon (StatusNotifierItem over D-Bus), on the tokio runtime of ipc.rs.
ksni = "0.3"
ldm-ipc.workspace = true
libc.workspace = true
tokio.workspace = true
