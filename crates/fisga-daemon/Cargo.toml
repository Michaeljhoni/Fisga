[package]
name = "fisga-daemon"
description = "fisgad: background service that runs the downloads"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fisgad"
path = "src/main.rs"

[dependencies]
fisga-i18n.workspace = true
anyhow.workspace = true
dirs.workspace = true
fisga-core.workspace = true
fisga-ipc.workspace = true
reqwest.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

# Stopping yt-dlp's process group, and the lock on the download list.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# A job object holds yt-dlp and what it starts (ffmpeg), ended together.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
