[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"

[workspace.dependencies]
fisga-core = { path = "crates/fisga-core" }
fisga-ipc = { path = "crates/fisga-ipc" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures-util = "0.3"
indicatif = "0.17"
libc = "0.2"
percent-encoding = "2"
# Already in the tree through rustls; used for its SHA-1/2.
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "fs", "sync", "time", "process", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = "thin"
strip = true
