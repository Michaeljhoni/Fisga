name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: System packages (GTK 4, Xvfb for the GUI test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev pkg-config xvfb xdotool imagemagick dbus-x11 adwaita-icon-theme fonts-dejavu-core shared-mime-info

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # --locked: a Cargo.lock out of date fails here, not in makepkg.
      - name: Unit and integration tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build binaries and the test server
        run: cargo build --workspace --bins --examples

      - name: End to end (daemon, CLI, native host, confirmation)
        run: bash scripts/e2e.sh target/debug

      - name: GUI under Xvfb (confirmation, progress, main window, preferences)
        run: dbus-run-session -- bash scripts/ci/gui-smoke.sh target/debug target/gui-shots

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: target/gui-shots
          if-no-files-found: ignore

  # Windows and macOS: the daemon, the CLI and the native host (the GUI is
  # still Linux only).
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Unit and integration tests
        run: cargo test --workspace --exclude fisga-gui --locked

      - name: Clippy
        run: cargo clippy --workspace --exclude fisga-gui --all-targets

  # The GTK interface on Windows: GTK 4 and the Rust toolchain from MSYS2
  # (UCRT64), as the Windows installer is built.
  gui-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust

      - name: Tests
        run: cargo test -p fisga-gui --locked

      - name: Clippy
        run: cargo clippy -p fisga-gui --all-targets

  # The GTK interface on macOS, with GTK 4 from Homebrew.
  gui-macos:
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: GTK 4
        run: brew install gtk4 librsvg adwaita-icon-theme pkgconf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test -p fisga-gui --locked

      - name: Clippy
        run: cargo clippy -p fisga-gui --all-targets

  # The packages sent to the Chrome Web Store and addons.mozilla.org, checked
  # with Mozilla's own linter; the artifact is what gets uploaded.
  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Store packages
        run: |
          bash extension/build.sh
          cd extension/dist-store
          version="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' ../manifest.chrome.json)"
          unzip -l "fisga-chrome-$version.zip"
          unzip -p "fisga-chrome-$version.zip" manifest.json \
            | python3 -c 'import json, sys; m = json.load(sys.stdin); assert "key" not in m, "key in the store manifest"'
          unzip -p "fisga-firefox-$version.zip" manifest.json | python3 -m json.tool > /dev/null

      - name: addons.mozilla.org linter
        run: npx --yes web-ext@8 lint --source-dir extension/dist/firefox

      - uses: actions/upload-artifact@v4
        with:
          name: extension-stores
          path: extension/dist-store/*.zip
          if-no-files-found: error

  # The Arch package (packaging/arch/PKGBUILD), built as the owner would: makepkg
  # from this checkout, then installed and checked.
  arch-package:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 40
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4

      - uses: actions/checkout@v4

      # The AUR takes each PKGBUILD with its .SRCINFO; a stale .SRCINFO fails here.
      - name: .SRCINFO matches the PKGBUILD
        run: |
          useradd -m builder
          chown -R builder "$PWD"
          su builder -c "cd packaging/arch && makepkg --printsrcinfo | diff -u .SRCINFO -"
          su builder -c "cd packaging/arch-bin && makepkg --printsrcinfo | diff -u .SRCINFO -"

      - name: makepkg
        run: |
          su builder -c "git config --global --add safe.directory '$PWD' && cd packaging/arch && FISGA_GIT='git+file://$PWD' makepkg --noconfirm --nocheck"

      - name: Install and check the package
        run: |
          # Not fisga-git-debug-*, which makepkg also builds; r62.abc1234 or 1.0.0.r3.gabc1234.
          pkg="$(ls packaging/arch/fisga-git-[0-9r]*.pkg.tar.zst)"
          pacman -Qlp "$pkg"
          pacman -U --noconfirm "$pkg"
          fisga --version
          test -x /usr/bin/fisgad && test -x /usr/bin/fisga-gui && test -x /usr/bin/fisga-native-host
          grep -q '"path": "/usr/bin/fisga-native-host"' /usr/lib/mozilla/native-messaging-hosts/io.fisga.native.json
          grep -q '"path": "/usr/bin/fisga-native-host"' /etc/chromium/native-messaging-hosts/io.fisga.native.json
          test -f /usr/share/fisga/extension/chrome/manifest.json && test -f /usr/share/fisga/extension/firefox/manifest.json
          grep -q '^Exec=fisga-gui' /usr/share/applications/io.fisga.Fisga.desktop
          grep -q '^Icon=io.fisga.Fisga$' /usr/share/applications/io.fisga.Fisga.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/io.fisga.Fisga.svg
          test -f /usr/share/icons/hicolor/256x256/apps/io.fisga.Fisga.png
          pacman -Qip "$pkg" | grep -E '^Licenses +: GPL-3.0-or-later$'
          echo "PACKAGE OK"
