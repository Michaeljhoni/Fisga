[package]
name = "fisga-gui"
description = "fisga-gui: GTK4 interface (download list and the \"Novo download\" window); a client of fisgad"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.83"

[[bin]]
name = "fisga-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
fisga-ipc.workspace = true
libc.workspace = true
tokio.workspace = true

# Tray icon on Linux (StatusNotifierItem over D-Bus), on the tokio runtime of ipc.rs.
[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
ksni = "0.3"

# Tray icon in Windows' notification area and macOS's menu bar.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26"
